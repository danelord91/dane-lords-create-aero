[camera]
	#While you drift, your camera follows the rotation of your kart.
	#Disable it if moving cameras make you uncomfortable.
	driftCameraFollow = true
	#How much of the kart rotation the camera follows while drifting.
	#1.0 = the kart stays centred, 0.5 = half of the rotation, 0.0 = no effect.
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	driftCameraStrength = 1.0

[hints]
	#Once per game session, the first time you reach drift speed, a short message
	#in the action bar reminds you which keys make the kart drift.
	driftHint = true
	#Testing aid: show the drift reminder every time you reach drift speed (not only once).
	driftHintAlways = false

[particles]
	#3.1: green or blue particles behind the rear wheels of a kart with glued wheels, while it moves.
	wheelParticles = true

[jei]
	#3.1: in JEI, show the kart sequenced assembly (11 steps) in Create's category with identical steps grouped
	#(5 boxes, e.g. Wheel x4), so that it fits. Ignored when Create JEI Compat is installed.
	compactKartAssembly = true
